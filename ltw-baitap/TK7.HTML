<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập TK7 - Tạo chuỗi ngẫu nhiên</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #27ae60; }
        #result { margin-top: 15px; font-weight: bold; font-size: 18px; color: #e74c3c; word-break: break-all; }
        .back-link { display: block; margin-top: 20px; text-decoration: none; color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bài tập TK7: Tạo chuỗi ngẫu nhiên</h2>
        <button onclick="generateString()">Tạo chuỗi ngẫu nhiên</button>
        <div id="result"></div>
        <a href="42.html" class="back-link">&larr; Quay về trang chủ</a>
    </div>
    <script>
        function generateString() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let res = '';
            for (let i = 0; i < 10; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('result').innerText = "Kết quả: " + res;
        }
    </script>
</body>
</html>
